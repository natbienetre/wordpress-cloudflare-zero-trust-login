name: WordPress Plugin

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |-
            extends: default
            rules:
              document-start:
                present: false
              truthy:
                check-keys: false
            ignore:
              - node_modules
              - vendor

  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: overtrue/phplint@9.1.2

  composer-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: test ! -f composer.json || composer validate --strict

  wordpress-phpunit:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v3

      - name: Run tests
        id: test
        # yamllint disable-line rule:line-length
        uses: holyhope/test-wordpress-plugin-github-action@1e7895de5852603e93a8e92afe9d008b76521355
        with:
          plugin_slug: cloudflare-zero-trust-login

      - uses: mikepenz/action-junit-report@v3
        if: always()
        with:
          report_paths: ${{ steps.test.outputs.junit_report }}

  language-files-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Check for translatable changes
        id: translatable
        env:
          BASE_SHA: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |-
          if git diff --quiet "$BASE_SHA" HEAD -- \
            ':(glob)**/*.php' \
            ':(glob)**/*.js' \
            ':(glob)**/block.json' \
            ':(glob)**/theme.json' \
            ':(glob)languages/*.po' \
            ':(glob)languages/*.pot'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: holyhope/test-wordpress-languages-github-action@v4.0.1
        if: steps.translatable.outputs.changed == 'true'
        id: languages
        with:
          slug: cloudflare-zero-trust-login
          exclude: |-
            .github
      - uses: actions/upload-artifact@v4
        if: always() && steps.translatable.outputs.changed == 'true'
        with:
          name: language-patch
          path: ${{ steps.languages.outputs.patch_path }}
